function renderDevTeam() {
  const d = DEV_TEAM[LANG];
  const md = (x) => esc(x).replace(/`([^`]+)`/g, '<code class="px-1 py-0.5 rounded bg-slate-100 text-[0.85em] text-slate-800">$1</code>');
  $('devTeam').innerHTML =
    '<h3 class="text-lg font-semibold">' + esc(d.title) + '</h3>' +
    '<p class="mt-2 text-sm text-slate-600 leading-relaxed max-w-3xl">' + md(d.lead) + '</p>' +
    '<ol class="mt-5 grid md:grid-cols-2 lg:grid-cols-3 gap-4">' + d.steps.map(([h, b], i) =>
      '<li class="rounded-xl border border-slate-200 bg-slate-50 p-4">' +
      '<div class="flex items-center gap-2"><span class="w-6 h-6 rounded-full bg-brand-700 text-white text-xs font-bold flex items-center justify-center shrink-0">' + (i + 1) + '</span>' +
      '<span class="font-semibold text-slate-900">' + esc(h) + '</span></div>' +
      '<p class="mt-2 text-sm text-slate-700 leading-relaxed">' + md(b) + '</p></li>').join('') + '</ol>' +
    '<div class="mt-5 rounded-xl border border-amber-200 bg-amber-50 p-4">' +
    '<div class="font-semibold text-amber-900 text-sm">' + esc(d.dontTitle) + '</div>' +
    '<ul class="mt-2 space-y-1.5 text-sm text-amber-950 list-disc pl-5">' + d.donts.map(x => '<li>' + md(x) + '</li>').join('') + '</ul></div>' +
    '<p class="mt-4 text-sm text-slate-600">' + esc(d.more) + ' <a class="text-brand-700 font-medium hover:underline" href="01-getting-started/aidlc-developer-greenfield-guide.md">01-getting-started/aidlc-developer-greenfield-guide.md</a></p>';
}

  ['gov', 'G4 (UAT) không đạt thì làm gì?', 'What happens when G4 (UAT) fails?',
   'Phân loại nguyên nhân trước khi sửa: lỗi thực hiện → Construction; spec sai/thiếu → G1; contract sai → G2; NFR không đạt → Design; yêu cầu mới → tách feature mới; môi trường/dữ liệu UAT → sửa môi trường, không lùi trạng thái. PO chọn: từ chối, phát hành có điều kiện, hoặc phát hành một phần bằng feature flag. Mỗi lần G4 fail đưa vào Retro AI.',
   'Classify the cause before fixing: implementation defect → Construction; wrong/missing spec → G1; wrong contract → G2; NFR miss → Design; new requirement → new feature; UAT environment/data → fix the environment, no status rollback. The PO chooses: reject, conditional release, or partial release via feature flag. Every G4 failure goes to Retro AI.'],
  ['gov', 'Phát hiện contract sai sau G2 thì sao?', 'What if a contract turns out wrong after G2?',
   'Agent và dev dừng lại và báo SA — không tự vá contract. Quay lại G2: SA sửa contract, gắn tag mới; các unit liên quan chuyển blocked cho tới khi cập nhật xong.',
   'Agents and developers stop and tell the SA — never patch the contract. Go back to G2: the SA fixes the contract and tags a new version; affected units become blocked until updated.'],

  ['spec', 'Product spec chính của dự án nằm ở đâu?', 'Where does the project\'s main product spec live?',
   'AI-DLC không có sẵn living spec; mỗi intent chỉ ghi một lần thay đổi. Sự thật nằm ở: specs/ (hệ thống phải làm gì), contracts/ (ranh giới giữa service), codekb/ (hệ thống thực sự đang là gì, sinh từ code — với DragonX chỉ có từ sau release đầu tiên). BRD là đầu vào lập kế hoạch, không phải nguồn sự thật. Artifact trong intents/ là lịch sử, không phải trạng thái hiện tại.',
   'AI-DLC has no built-in living spec; each intent records one change. Truth lives in: specs/ (what the system must do), contracts/ (service boundaries), codekb/ (what the system actually is, generated from code — for DragonX only from the first release on). The BRD is planning input, not a source of truth. Artifacts in intents/ are history, not current state.'],
  ['spec', 'Tạo living spec cho dự án greenfield thế nào?', 'How do we create living specs on a greenfield project?',
   '(A) Khởi tạo khung từ BRD: lập bản đồ capability → chốt template spec.md → AI tạo spec.md khung (chỉ Purpose và Out of scope, chưa có requirement) → PO, BA, SA duyệt → gắn baseline rỗng specs-v<yyyy.mm>.0. Không chép BRD vào specs/. (B) Giữ sống: mọi thay đổi đi qua spec delta (các release đầu chủ yếu là ADDED), gộp vào specs/ ở G5, kiểm tra drift hằng ngày; kiểm tra dựa trên codekb bật từ sau release đầu tiên.',
   '(A) Skeleton from the BRD: map capabilities → agree the spec.md template → AI creates skeleton spec.md files (Purpose and Out of scope only, no requirements yet) → PO, BA, SA review → tag an empty baseline specs-v<yyyy.mm>.0. Never copy the BRD into specs/. (B) Keep it living: every change goes through a spec delta (mostly ADDED in early releases), merged into specs/ at G5, with daily drift checks; codekb-based checks start after the first release.'],
  ['spec', 'Tài liệu (BRD, quy định, tiêu chuẩn), link web, API spec, DDL đặt ở đâu?', 'Where do documents (BRD, regulations, standards), web links, API specs and DDL go?',
   'Tài liệu PDF/Word → knowledge/documents/ rồi /aidlc knowledge onboard (Word nên chuyển Markdown). Link web → lưu thành PDF/MD, hoặc liệt kê trong reference-links.md; docs SDK công khai dùng MCP context7. API spec → product-specs/contracts/ (là contract, không phải knowledge). DDL → greenfield nên schema được thiết kế mới, nằm trong service sở hữu database (db/migrations, kèm db/schema.sql); DDL hệ thống bên ngoài cần đọc → product-specs/data/<db>/; kèm ghi chú data-model.md.',
   'PDF/Word docs → knowledge/documents/ then /aidlc knowledge onboard (convert Word to Markdown). Web links → save as PDF/MD, or list in reference-links.md; public SDK docs via the context7 MCP. API specs → product-specs/contracts/ (they are contracts, not knowledge). DDL → greenfield, so the schema is designed new in the service owning the database (db/migrations, plus db/schema.sql); DDL of external systems you read → product-specs/data/<db>/; plus a data-model.md note.'],
  ['spec', 'Knowledge và Rules khác nhau thế nào?', 'What is the difference between Knowledge and Rules?',
   'Rules (memory/) là câu ngắn NEVER/ALWAYS, bắt buộc — người review sẽ từ chối output nếu vi phạm. Knowledge là tài liệu tham khảo, có thể dài, giúp agent hiểu ngữ cảnh. File trong knowledge/aidlc-shared/ được nạp ở mọi stage nên phải ngắn và cập nhật; tài liệu lớn để trong DocumentKB.',
   'Rules (memory/) are short, mandatory NEVER/ALWAYS statements — a reviewer would reject output that breaks them. Knowledge is reference material, possibly long, giving agents context. Files in knowledge/aidlc-shared/ load at every stage so keep them short and current; large documents belong in DocumentKB.'],
  ['spec', 'Khởi động dự án greenfield (DragonX 3.0) thế nào?', 'How do we start the greenfield project (DragonX 3.0)?',
   'Tạo repo rỗng trên Azure Repos → chạy setup-macos.sh → repos.json (org + url từng repo) và aidlc system workspace-sync → SA chạy aidlc config --harness claude --mcp none, ghi model preset, commit .claude/ cùng manifest → viết rule (team.md, project.md ghi rõ greenfield) và onboard BRD/C4 → khung living spec, baseline rỗng → Bolt 0: khung repo, lệnh kiểm tra, pipeline PR → intent đầu tiên là walking skeleton: /aidlc --project-type greenfield "…" (scope mvp hoặc feature). Không chạy Reverse Engineering; chạy lần đầu sau release đầu tiên. Xem 01-getting-started/aidlc-greenfield-quickstart.md.',
   'Create empty repos in Azure Repos → run setup-macos.sh → repos.json (org + a url per repo) and aidlc system workspace-sync → the SA runs aidlc config --harness claude --mcp none, records a model preset, commits .claude/ with its manifest → write rules (team.md, project.md stating greenfield) and onboard the BRD/C4 → living-spec skeleton, empty baseline → Bolt 0: repo scaffolding, check command, PR pipeline → the first intent is a walking skeleton: /aidlc --project-type greenfield "…" (scope mvp or feature). No Reverse Engineering; run it first after the first release. See 01-getting-started/aidlc-greenfield-quickstart.md.'],

  ['build', 'Tính năng đi qua chuỗi nhiều service được xử lý thế nào?', 'How is a feature that runs through a chain of services handled?',
   'Một intent trải trên nhiều repo. 2.7 chia mỗi service thành một unit và dựng đồ thị phụ thuộc — đặt unit kind: spec (contract) ở gốc để các service build song song bằng mock. 2.8 tạo contract cho mọi cạnh (gồm timeout, retry, idempotency). 2.9 chọn walking skeleton xuyên toàn chuỗi. 3.6 kiểm thử tích hợp một lần cho cả chuỗi, gồm luồng lỗi.',
   'One intent spanning several repos. 2.7 makes each service a unit and builds the dependency graph — put a kind: spec (contract) unit at the root so services build in parallel against mocks. 2.8 creates a contract for every edge (incl. timeout, retry, idempotency). 2.9 picks a walking skeleton through the whole chain. 3.6 runs integration tests once across the chain, including failure paths.'],
  ['build', 'Team mode của AI-DLC có dùng được cho DragonX không?', 'Can DragonX use AI-DLC team mode?',
   'Hiện chưa. Team mode (nhiều team claim unit song song) yêu cầu workspace root chính là repo nguồn; intent trải trên các repo đặt cạnh nhau bị từ chối. DragonX dùng solo ownership: Inception/Design do SA hoặc BA dẫn dắt; Construction — sau G2, mỗi developer chạy một intent riêng cho unit được giao, trong workspace product-specs (không phải trong repo code); delivery-status nối các unit về tính năng. Xem mục "Developer làm việc nhóm" ở Phần 3.',
   'Not currently. Team mode (teams claiming units in parallel) requires the workspace root to be the source repo; intents spanning sibling repos are rejected. DragonX uses solo ownership: SA or BA drives Inception/Design; for Construction, after G2 each developer runs a separate intent for their assigned unit in the product-specs workspace (not inside the code repo), with delivery-status linking units back to the feature. See "Developer teamwork" in Section 3.'],
  ['build', 'Repo code (backend, web-app, stonehub-web, mobile-app) có cần thư mục aidlc/ không?', 'Do the code repos (backend, web-app, stonehub-web, mobile-app) need an aidlc/ folder?',
   'Không. AI-DLC 2.0 chỉ có một workspace là product-specs: .claude/ và aidlc/spaces/… (memory, knowledge, codekb, intents) nằm ở đó. Repo code là thư mục con có git riêng, do lệnh aidlc system workspace-sync clone vào và đã được gitignore; AI-DLC tự nhận ra chúng khi tạo intent và ghi code vào đúng repo. Repo code chỉ chứa code, test, AGENTS.md, .product-specs.yaml và work/<feature>/<Ux>-<service>/ (unit.yaml, tasks.md). Không chạy aidlc config trong repo code: lệnh đó tạo workspace thứ hai, làm hồ sơ intent và audit bị tách đôi. Luôn mở Claude Code ở gốc product-specs. Lưu ý: planning/04-repo-layout.md còn mô tả aidlc/<AB#id>/ trong repo dragonx — đó là thư mục theo work item của harness cũ (port từ bond-market), không phải AI-DLC 2.0.',
   'No. AI-DLC 2.0 has a single workspace, product-specs: .claude/ and aidlc/spaces/… (memory, knowledge, codekb, intents) live there. Code repos are child folders with their own git, cloned by aidlc system workspace-sync and gitignored; AI-DLC discovers them when an intent is created and writes code into the right repo. A code repo holds only code, tests, AGENTS.md, .product-specs.yaml and work/<feature>/<Ux>-<service>/ (unit.yaml, tasks.md). Never run aidlc config inside a code repo: it creates a second workspace and splits intent records and audit in two. Always open Claude Code at the product-specs root. Note: planning/04-repo-layout.md still describes aidlc/<AB#id>/ in a dragonx repo — that is the per-work-item folder of the older harness ported from bond-market, not AI-DLC 2.0.'],
  ['build', 'Team đông developer, mỗi người chạy một intent có được không?', 'With many developers, can each run their own intent?',
   'Được — đây là cách làm song song duy nhất với bố cục nhiều repo (team mode không dùng được). Mỗi intent có thư mục hồ sơ riêng, con trỏ active-intent nằm trên máy từng người, audit ghi theo từng bản clone. Điểm cần quản lý khi cùng đẩy về product-specs: intents.json là sổ đăng ký chung nên PR song song dễ conflict (rebase, giữ cả hai dòng); memory/ chỉ SA sửa; không để hai người chạy chung một intent; đặt reviewer theo đường dẫn để PR hồ sơ intent không phải chờ PO + SA. Chi tiết ở mục "Developer làm việc nhóm" (Phần 3).',
   'Yes — it is the only way to work in parallel with a multi-repo layout (team mode is unavailable). Each intent has its own record folder, the active-intent cursor is per user, and audit is sharded per clone. What to manage when everyone pushes to product-specs: intents.json is a shared registry, so parallel PRs conflict easily (rebase, keep both rows); only the SA edits memory/; never let two people drive the same intent; use path-based reviewers so intent-record PRs do not wait on PO + SA. Details under "Developer teamwork" (Section 3).'],
  ['build', 'Cấu trúc repo code chuẩn gồm những gì?', 'What does a standard code repo contain?',
   'Backend là monorepo: AGENTS.md gốc, .product-specs.yaml (một tag cho cả repo), contracts/ (CI đồng bộ, chỉ đọc), services/<service>/ (AGENTS.md riêng, src/, db/migrations + schema.sql, tests/, docs/service.md, pipeline theo path), libs/ dùng chung, work/<feature>/<Ux>-<service>/ (unit.yaml, tasks.md). Service không import code của nhau. Web (web-app), back office (stonehub-web) và mobile là repo riêng với cấu trúc tương tự một service.',
   'The backend is a monorepo: root AGENTS.md, .product-specs.yaml (one tag for the repo), contracts/ (CI-synced, read-only), services/<service>/ (own AGENTS.md, src/, db/migrations + schema.sql, tests/, docs/service.md, path-triggered pipeline), shared libs/, work/<feature>/<Ux>-<service>/ (unit.yaml, tasks.md). Services never import each other\'s code. Web (web-app), back office (stonehub-web) and mobile are separate repos shaped like a single service.'],
  ['gov', 'Vì sao delivery-status là nhánh riêng trong product-specs?', 'Why is delivery-status a separate branch of product-specs?',
   'Để bớt một repo mà vẫn giữ bảo vệ G1/G2. Azure DevOps phân quyền theo nhánh, nên Build Service được ghi nhánh orphan delivery-status nhưng không ghi được main. Nếu đặt trạng thái thành thư mục trên main, Build Service phải bypass policy toàn nhánh. Không merge/rebase giữa hai nhánh; workspace không checkout delivery-status (ADR-0002, thay ADR-0001).',
   'To drop one repo while keeping G1/G2 protection. Azure DevOps sets permissions per branch, so the Build Service can write the orphan delivery-status branch but not main. A status folder on main would require bypassing policies on the whole branch. Never merge/rebase between the two; the workspace never checks out delivery-status (ADR-0002, supersedes ADR-0001).'],
  ['build', 'AI có được sửa test hoặc contract để build xanh không?', 'May AI modify tests or contracts to get a green build?',
   'Không bao giờ. Agent không được sửa contracts/, không được sửa/tắt/xóa test để pass, không tự merge PR, không đưa secret hoặc dữ liệu khách hàng vào code, test, prompt. Gặp spec/contract sai thì dừng và hỏi người.',
   'Never. Agents may not edit contracts/, modify/disable/delete tests to pass, self-merge PRs, or put secrets or customer data into code, tests or prompts. If a spec/contract looks wrong, stop and ask a human.'],

  ['deploy', 'Có nên đưa hạ tầng vào workflow AI-DLC không?', 'Should infrastructure be part of the AI-DLC workflow?',
   'Có, nhưng chia đôi: thay đổi hạ tầng do tính năng sinh ra (route API gateway, queue, DB, secret) đi trong AI-DLC như một thành phần (repo IaC, unit riêng, deploy hạ tầng trước). Vận hành nền tảng (vá, scale, sự cố) chạy luồng Ops riêng. Agent chỉ chạy plan/what-if; network, IAM, gateway auth luôn là tier L.',
   'Yes, but split it: feature-driven infra changes (API gateway routes, queues, DBs, secrets) go through AI-DLC as a component (IaC repo, own unit, infra deployed first). Platform operations (patching, scaling, incidents) run a separate Ops flow. Agents run plan/what-if only; network, IAM and gateway auth are always tier L.'],
  ['deploy', 'Tích hợp 3rd-party service/SDK: tài liệu để đâu, đồng bộ thế nào?', 'Third-party services/SDKs: where do docs go and how are they synced?',
   'Spec vendor (OpenAPI/AsyncAPI) → contracts/external/<vendor>/<version>/ kèm vendor.yaml (chỉ đọc). Cách mình dùng vendor → integrations/<vendor>/integration.md. PDF/portal → knowledge/documents/vendors/. AI-DLC không tự đồng bộ: dùng pipeline hằng tuần tải spec, so sánh bằng oasdiff, mở PR cho SA duyệt; Renovate cho SDK. Code chỉ gọi vendor qua adapter.',
   'Vendor specs (OpenAPI/AsyncAPI) → contracts/external/<vendor>/<version>/ with vendor.yaml (read-only). How we use the vendor → integrations/<vendor>/integration.md. PDFs/portals → knowledge/documents/vendors/. AI-DLC does not sync on its own: a weekly pipeline downloads specs, diffs them with oasdiff and opens a PR for SA review; Renovate handles SDKs. Code calls vendors only via an adapter.'],
  ['deploy', 'Thứ tự triển khai một tính năng ra sao?', 'What is the deployment order for a feature?',
   'Hạ tầng/gateway → backend (provider trước consumer) → web và stonehub-web → mobile (bật feature flag). Mobile luôn qua G4 trước khi nộp store; nếu lỗi sau khi lên store, tắt flag trước rồi mới sửa.',
   'Infrastructure/gateway → backend (providers before consumers) → web and stonehub-web → mobile (behind a feature flag). Mobile always passes G4 before store submission; if a defect appears after release, switch the flag off first, then fix.'],
  ['deploy', 'Trạng thái unit được cập nhật thế nào?', 'How is unit status updated?',
   'PR có nhãn unit-complete được merge → done (kèm PR, commit, kết quả scenario). Deploy staging (mobile: bản build nội bộ) → verified. QA/SA chạy set-unit-status → integrated. Deploy production (mobile: lên store) → released. Mọi trạng thái được ghi lên nhánh delivery-status của product-specs. Pipeline aggregate cập nhật Boards, Wiki và tạo task G3.5 khi đủ điều kiện.',
   'A merged PR labelled unit-complete → done (with PR, commit, scenario results). Staging deploy (mobile: internal build) → verified. QA/SA run set-unit-status → integrated. Production deploy (mobile: store release) → released. All status is written to the delivery-status branch of product-specs. The aggregate pipeline updates Boards and the Wiki and creates the G3.5 task when ready.']
];

const $ = (id) => document.getElementById(id);
const t = (key) => (UI[key] ? UI[key][LANG] : key);
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const norm = (s) => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
function highlight(text, q) {
  const safe = esc(text);
  if (!q) return safe;
  // Normalise char-by-char so indices stay aligned with the original text (diacritic-insensitive)
  const chars = Array.from(String(text));
  const nChars = chars.map(ch => { const n = norm(ch); return n.length === 1 ? n : ch.toLowerCase(); });
  const nq = norm(q);
  const idx = nChars.join('').indexOf(nq);
  if (idx < 0 || nChars.join('').length !== chars.length) return safe;
  const len = Array.from(nq).length;
  return esc(chars.slice(0, idx).join('')) + '<mark>' + esc(chars.slice(idx, idx + len).join('')) + '</mark>' + esc(chars.slice(idx + len).join(''));
}
function list(items, cls = '') {
  return '<ul class="space-y-1.5 ' + cls + '">' + items.map(i => '<li class="flex gap-2"><span class="text-brand-600 mt-0.5">•</span><span>' + esc(i) + '</span></li>').join('') + '</ul>';
}

/* =====================================================================
   MERMAID
   ===================================================================== */
let mermaidReady = false;
let renderSeq = 0;
// Google Fonts splits Inter into unicode-range subsets (latin, latin-ext, vietnamese).
// The Vietnamese subset only downloads when such glyphs are used, so Mermaid could
// measure labels with a fallback font and then draw them in Inter (wider) -> clipped.
// Force-load every weight/subset Mermaid uses before rendering (max 3 s).
const FONT_SAMPLE = 'Aa ăâđêôơư ạảấầẩẫậắằẳẵặẹẻẽếềểễệỉịọỏốồổỗộớờởỡợụủứừửữựỳỵỷỹ';
function fontsReady() {
  if (!document.fonts || !document.fonts.load) return Promise.resolve();
  const loads = ['400', '500', '600', '700'].flatMap(w => ['14px', '16px'].map(sz => document.fonts.load(w + ' ' + sz + ' Inter', FONT_SAMPLE)));
  const all = Promise.all(loads).then(() => document.fonts.ready).catch(() => {});
  return Promise.race([all, new Promise(r => setTimeout(r, 3000))]);
}
// If a font arrives after the first render anyway, draw once more with correct widths.
if (document.fonts && document.fonts.addEventListener) {
  let refontTimer = null;
  document.fonts.addEventListener('loadingdone', () => {
    clearTimeout(refontTimer);
    refontTimer = setTimeout(() => { if (mermaidReady) renderMermaid(); }, 150);
  });
}
async function renderMermaid() {
  if (!window.mermaid) {
    ['mmd-lifecycle', 'mmd-repos', 'mmd-status'].forEach(id => { $(id).innerHTML = '<p class="text-sm text-slate-500">Mermaid.js could not be loaded (offline?).</p>'; });
    return;
  }
  if (!mermaidReady) {
    mermaid.initialize({
      startOnLoad: false, securityLevel: 'loose', theme: 'base',
      flowchart: { useMaxWidth: true, htmlLabels: true, curve: 'basis' },
      state: { useMaxWidth: true },
      themeVariables: { fontFamily: 'Inter, system-ui, sans-serif', fontSize: '14px', primaryColor: '#eef4ff', primaryBorderColor: '#2552e0', primaryTextColor: '#0f172a', lineColor: '#475569', edgeLabelBackground: '#ffffff' }
    });
    mermaidReady = true;
  }
  await fontsReady();
  const seq = ++renderSeq;
  for (const key of ['lifecycle', 'repos', 'status']) {
    const el = $('mmd-' + key);
    try {
      const { svg } = await mermaid.render('svg-' + key + '-' + seq, MMD[key][LANG]);
      if (seq !== renderSeq) return;
      el.innerHTML = svg;
    } catch (e) {
      el.innerHTML = '<pre class="text-xs text-rose-700 whitespace-pre-wrap">' + esc(e.message || e) + '</pre>';
    }
  }
}
